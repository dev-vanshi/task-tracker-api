openapi: 3.0.3
info:
  title: Task Tracker API
  version: 1.0.0
  description: REST API for managing projects, users, and assigned tasks.
servers:
  - url: http://localhost:8080
tags:
  - name: Projects
  - name: Users
  - name: Tasks
  - name: Info
paths:
  /api/info:
    get:
      tags: [Info]
      summary: Get application name and version
      responses:
        '200':
          description: Application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProjectResponse'}
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRequest'}
      responses:
        '201': {description: Created}
        '400': {description: Validation error}
        '409': {description: Duplicate project name}
  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      summary: Get project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectResponse'}
        '404': {description: Not found}
    put:
      tags: [Projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRequest'}
      responses:
        '200': {description: Updated}
        '404': {description: Not found}
        '409': {description: Duplicate name}
    delete:
      tags: [Projects]
      summary: Delete project (only when it has no tasks)
      responses:
        '204': {description: Deleted}
        '404': {description: Not found}
        '409': {description: Project still has tasks}
  /api/projects/{id}/tasks:
    get:
      tags: [Projects]
      summary: List tasks for project
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged task results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageTaskResponse'}
        '404': {description: Project not found}
  /api/users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UserResponse'}
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRequest'}
      responses:
        '201': {description: Created}
        '400': {description: Validation error}
        '409': {description: Duplicate email}
  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      summary: Get user
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '404': {description: Not found}
    put:
      tags: [Users]
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRequest'}
      responses:
        '200': {description: Updated}
        '404': {description: Not found}
        '409': {description: Duplicate email}
    delete:
      tags: [Users]
      summary: Delete user (only when not assigned to tasks)
      responses:
        '204': {description: Deleted}
        '404': {description: Not found}
        '409': {description: User is assigned to tasks}
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List and filter tasks
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [TODO, IN_PROGRESS, DONE]}
        - name: projectId
          in: query
          schema: {type: integer, format: int64}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sortBy
          in: query
          schema: {type: string, default: id, enum: [id, title, status, priority, dueDate]}
        - name: direction
          in: query
          schema: {type: string, default: asc, enum: [asc, desc]}
      responses:
        '200':
          description: Paged tasks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PageTaskResponse'}
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskRequest'}
      responses:
        '201': {description: Created}
        '400': {description: Validation error}
        '404': {description: Project or assignee not found}
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Tasks]
      summary: Get task
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResponse'}
        '404': {description: Not found}
    put:
      tags: [Tasks]
      summary: Update task
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskRequest'}
      responses:
        '200': {description: Updated}
        '400': {description: Validation error}
        '404': {description: Not found}
    delete:
      tags: [Tasks]
      summary: Delete task
      responses:
        '204': {description: Deleted}
        '404': {description: Not found}
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  schemas:
    InfoResponse:
      type: object
      properties:
        name: {type: string}
        version: {type: string}
    ProjectRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 150}
        description: {type: string, nullable: true, maxLength: 2000}
    ProjectResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        description: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    UserRequest:
      type: object
      required: [name, email, role]
      properties:
        name: {type: string, maxLength: 150}
        email: {type: string, format: email, maxLength: 254}
        role: {type: string, maxLength: 50}
    UserResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string}
    TaskRequest:
      type: object
      required: [title, projectId]
      properties:
        title: {type: string, maxLength: 200}
        status: {type: string, enum: [TODO, IN_PROGRESS, DONE], nullable: true}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH], nullable: true}
        projectId: {type: integer, format: int64}
        assigneeId: {type: integer, format: int64, nullable: true}
        dueDate: {type: string, format: date, nullable: true}
    TaskResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        status: {type: string, enum: [TODO, IN_PROGRESS, DONE]}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH]}
        projectId: {type: integer, format: int64}
        projectName: {type: string}
        assigneeId: {type: integer, format: int64, nullable: true}
        assigneeName: {type: string, nullable: true}
        dueDate: {type: string, format: date, nullable: true}
    PageTaskResponse:
      type: object
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/TaskResponse'}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        size: {type: integer}
        number: {type: integer}
