spring.application.name=${APP_NAME:task-tracker-api}
server.port=${SERVER_PORT:8080}

app.name=${APP_NAME:Task Tracker API}
app.version=${APP_VERSION:1.0.0}
task.default-priority=${TASK_DEFAULT_PRIORITY:MEDIUM}
pagination.default-page-size=${PAGINATION_DEFAULT_PAGE_SIZE:20}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tasktracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
