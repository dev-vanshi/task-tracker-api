services:
  task-tracker-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-tracker-api:1.0.0
    container_name: task-tracker-api
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Task Tracker API"
      APP_VERSION: "1.0.0"
      TASK_DEFAULT_PRIORITY: "MEDIUM"
      PAGINATION_DEFAULT_PAGE_SIZE: "20"
      SPRING_JPA_DDL_AUTO: "create-drop"
      H2_CONSOLE_ENABLED: "false"
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "false"
    restart: unless-stopped
